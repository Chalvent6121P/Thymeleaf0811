<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<!-- 取得迭代狀態 -->
<table width="60%" border="1">
	<th>Count</th><th>Index</th><th>Book ID</th><th>Book Name</th><th>Book Price</th>
	<th>First Row</th><th>Last Row</th>
	</tr>
		<tr th:each="book, stat : ${books}">
			<td th:text="${stat.count}">1</td>
			<td th:text="${stat.index}">0</td>
			<td th:text="${book.id}">ID</td>
			<td th:text="${book.bookName}">Book Name</td>
			<td th:text="${book.price}">Book Price</td>
			<td th:text="${stat.first}">是否是第一筆</td>
			<td th:text="${stat.last}">是否是最後一筆</td>
		</tr>
</table>
</body>
</html>
